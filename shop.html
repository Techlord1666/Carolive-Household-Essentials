<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Shop - Carolive Store</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        /* Fix Footer to Bottom */
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex-grow: 1; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        
        #cart-sidebar { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #cart-sidebar.active { transform: translateX(0); }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#191c1d] font-sans">

<!-- Header -->
<header class="bg-white border-b sticky top-0 z-[1000]">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <button onclick="toggleMenu()" class="flex items-center gap-1 text-[#003652] font-bold">
            <span class="material-symbols-outlined text-3xl">menu</span>
        </button>

        <div class="flex flex-col items-center">
            <h1 class="text-xl md:text-2xl font-black text-[#003652] italic leading-none">Carolive</h1>
            <span class="text-[7px] tracking-[0.2em] font-bold text-teal-600 uppercase">Premium Home</span>
        </div>

        <button onclick="toggleCart()" class="relative">
            <span class="material-symbols-outlined text-3xl text-[#003652]">shopping_cart</span>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
        </button>
    </div>
</header>

<!-- Navigation Menu -->
<div id="mobileMenu" class="hidden fixed inset-0 z-[1100] bg-white p-8 flex flex-col gap-6">
    <button onclick="toggleMenu()" class="material-symbols-outlined text-3xl">close</button>
    <a href="index.html" class="text-xl font-bold border-b pb-2">Home</a>
    <a href="shop.html" class="text-xl font-bold border-b pb-2">Shop</a>
    <a href="about.html" class="text-xl font-bold border-b pb-2">About Us</a>
    <a href="#" class="text-xl font-bold border-b pb-2 text-teal-600">Sign Up</a>
</div>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 py-10">
    <h2 class="text-3xl font-black text-[#003652] mb-8 text-center md:text-left">Our Collection</h2>
    
    <!-- Grid: 2 mobile, 5 laptop -->
    <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-5 gap-4 md:gap-8">
        <!-- Products will load here -->
    </div>
</main>

<!-- Admin Password Modal -->
<div id="passModal" class="modal">
    <div class="modal-content text-center">
        <h2 class="text-xl font-bold mb-4">Admin Access</h2>
        <input type="password" id="adminPass" placeholder="Enter Password" class="w-full p-3 border rounded-xl mb-4">
        <button onclick="verifyAdmin()" class="w-full py-3 bg-[#003652] text-white rounded-xl font-bold">Login</button>
        <button onclick="closeModal('passModal')" class="mt-2 text-sm text-slate-400">Cancel</button>
    </div>
</div>

<!-- Admin Upload Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h2 class="text-2xl font-bold mb-4">Upload New Product</h2>
        <form id="adminForm" class="space-y-4">
            <input type="text" id="pName" placeholder="Product Name" required class="w-full p-3 border rounded-xl">
            <input type="number" id="pPrice" placeholder="Price (₦)" required class="w-full p-3 border rounded-xl">
            <textarea id="pDesc" placeholder="Description" rows="3" class="w-full p-3 border rounded-xl"></textarea>
            
            <div class="space-y-2">
                <p class="text-xs font-bold text-slate-500">Upload 5 Images (Main image first):</p>
                <input type="file" id="file1" accept="image/*" class="w-full text-xs">
                <input type="file" id="file2" accept="image/*" class="w-full text-xs">
                <input type="file" id="file3" accept="image/*" class="w-full text-xs">
                <input type="file" id="file4" accept="image/*" class="w-full text-xs">
                <input type="file" id="file5" accept="image/*" class="w-full text-xs">
            </div>

            <button type="submit" id="uploadBtn" class="w-full py-4 bg-teal-600 text-white rounded-xl font-bold">
                <span id="btnText">UPLOAD PRODUCT</span>
            </button>
        </form>
    </div>
</div>

<!-- Footer (Fixed to bottom) -->
<footer class="bg-[#0b101a] text-white pt-12 pb-8 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
        <div>
            <h3 class="text-2xl font-black italic">Carolive</h3>
            <p class="text-slate-500 text-xs mt-2">© 2025 Carolive Store Nigeria.</p>
        </div>
        <!-- Admin Hidden Trigger -->
        <span onclick="openModal('passModal')" class="cursor-default opacity-10 text-[10px] hover:opacity-100 transition">admin</span>
    </div>
</footer>

<!-- Standard Cart/Product Modals remain same as previous version -->
<div id="productModal" class="modal" onclick="closeModal('productModal')"><div class="modal-content" onclick="event.stopPropagation()"><div id="modal-body" class="flex flex-col gap-6"></div></div></div>
<div id="cart-overlay" class="fixed inset-0 bg-black/50 z-[2000] hidden" onclick="toggleCart()"></div>
<div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 md:w-96 bg-white z-[2001] p-6 shadow-2xl overflow-y-auto">
    <h2 class="text-2xl font-bold mb-8 border-b pb-4">Your Cart</h2>
    <div id="cart-items" class="space-y-4 mb-8"></div>
    <div class="border-t pt-4"><div class="flex justify-between text-xl font-bold mb-6"><span>Total:</span><span id="cart-total">₦0</span></div>
    <button onclick="openCheckout()" class="w-full py-4 bg-[#003652] text-white rounded-xl font-bold">PROCEED TO CHECKOUT</button></div>
</div>

<script>
    const supabaseUrl = 'https://bfeicdnalzokkutpkwki.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmZWljZG5hbHpva2t1dHBrd2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzY2NDIsImV4cCI6MjA5NDI1MjY0Mn0.lK42cRXm_ulcwiSPah3Tg_z3Uwp4WpcIlu_VSYnWVNE';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allProducts = [];
    let cart = [];

    // Admin Password Verification
    function verifyAdmin() {
        const pass = document.getElementById('adminPass').value;
        if(pass === '+2347036247597') {
            closeModal('passModal');
            openModal('adminModal');
        } else {
            alert("Incorrect Password");
        }
    }

    // Load Products
    async function loadProducts() {
        const { data } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
        if (data) { allProducts = data; renderProducts(); }
    }

    function renderProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = allProducts.map(p => `
            <div class="bg-white rounded-2xl shadow-sm border p-2 cursor-pointer" onclick="viewProduct('${p.id}')">
                <img src="${p.image1}" class="h-40 md:h-52 w-full object-cover rounded-xl mb-2">
                <h3 class="font-bold text-xs md:text-sm line-clamp-1">${p.name}</h3>
                <p class="text-teal-600 font-bold text-sm">₦${Number(p.price).toLocaleString()}</p>
            </div>
        `).join('');
    }

    // Admin Upload Logic (Image File to URL)
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('uploadBtn');
        const btnText = document.getElementById('btnText');
        btnText.innerText = "UPLOADING...";
        btn.disabled = true;

        const imageUrls = [];
        for (let i = 1; i <= 5; i++) {
            const fileInput = document.getElementById(`file${i}`);
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random()}.${fileExt}`;
                const filePath = `products/${fileName}`;

                const { data, error } = await _supabase.storage
                    .from('product-images')
                    .upload(filePath, file);

                if (data) {
                    const { data: urlData } = _supabase.storage.from('product-images').getPublicUrl(filePath);
                    imageUrls.push(urlData.publicUrl);
                }
            }
        }

        const product = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            description: document.getElementById('pDesc').value,
            image1: imageUrls[0] || null,
            image2: imageUrls[1] || null,
            image3: imageUrls[2] || null,
            image4: imageUrls[3] || null,
            image5: imageUrls[4] || null
        };

        const { error } = await _supabase.from('products').insert([product]);
        
        if (!error) {
            alert("Product Uploaded Successfully!");
            location.reload();
        } else {
            alert("Error: " + error.message);
            btn.disabled = false;
            btnText.innerText = "UPLOAD PRODUCT";
        }
    });

    // Navigation & UI Helpers
    function viewProduct(id) {
        const p = allProducts.find(x => x.id === id);
        document.getElementById('modal-body').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <img src="${p.image1}" id="mainView" class="w-full h-72 object-cover rounded-2xl mb-4">
                    <div class="flex gap-2 overflow-x-auto no-scrollbar">
                        ${[p.image1, p.image2, p.image3, p.image4, p.image5].filter(i => i).map(img => `
                            <img src="${img}" onclick="document.getElementById('mainView').src='${img}'" class="w-16 h-16 object-cover rounded-lg cursor-pointer border">
                        `).join('')}
                    </div>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-[#003652] mb-2">${p.name}</h2>
                    <p class="text-xl font-bold text-teal-600 mb-4">₦${Number(p.price).toLocaleString()}</p>
                    <p class="text-slate-600 text-sm mb-6">${p.description || ''}</p>
                    <button onclick="addToCart('${p.id}'); closeModal('productModal')" class="w-full py-4 bg-[#003652] text-white rounded-xl font-bold">ADD TO CART</button>
                </div>
            </div>
        `;
        openModal('productModal');
    }

    function addToCart(id) {
        const p = allProducts.find(x => x.id === id);
        cart.push(p);
        updateCartUI();
        toggleCart();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-items').innerHTML = cart.map((item, index) => `
            <div class="flex gap-4 items-center border-b pb-2">
                <img src="${item.image1}" class="w-12 h-12 object-cover rounded">
                <div class="flex-grow"><p class="text-xs font-bold">${item.name}</p><p class="text-xs text-teal-600">₦${Number(item.price).toLocaleString()}</p></div>
                <button onclick="removeFromCart(${index})" class="text-red-500 material-symbols-outlined text-sm">delete</button>
            </div>
        `).join('');
        const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
        document.getElementById('cart-total').innerText = `₦${total.toLocaleString()}`;
    }

    function removeFromCart(index) { cart.splice(index, 1); updateCartUI(); }
    function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); document.getElementById('cart-overlay').classList.toggle('hidden'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function toggleMenu() { document.getElementById('mobileMenu').classList.toggle('hidden'); }

    window.onload = loadProducts;
</script>
</body>
</html>
